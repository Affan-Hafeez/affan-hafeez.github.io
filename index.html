<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Garage Master Showroom</title>
    <link rel="stylesheet" href="style.css">
    <!-- These tags load your data sheets -->
    <script src="cars_early.js"></script>
    <script src="cars_middle.js"></script>
    <script src="cars_modern.js"></script>
</head>
<body class="era-1960s">

    <!-- MASTER DROPDOWN GAME MENU SYSTEM -->
    <header class="game-dashboard">
        <div class="menu-select-group">
            <label>SELECT ERA</label>
            <select id="era-dropdown" onchange="updateCountries()">
                <!-- Populated via JavaScript -->
            </select>
        </div>

        <div class="menu-select-group">
            <label>ORIGIN COUNTRY</label>
            <select id="country-dropdown" onchange="updateBrands()">
                <option value="">-- Choose Country --</option>
            </select>
        </div>

        <div class="menu-select-group">
            <label>MANUFACTURER</label>
            <select id="brand-dropdown" onchange="loadSelectedCar()">
                <option value="">-- Choose Brand --</option>
            </select>
        </div>
    </header>

    <!-- ARCADE SHOWROOM SCREEN -->
    <main class="showroom">
        <!-- Left Column: Media & Blog Review -->
        <section class="car-display">
            <h1 id="car-title">SELECT VEHICLE</h1>
            <div class="turntable">
                <!-- This image tag starts with your custom default Mustang picture -->
                <img id="car-image" src="1969 Ford Mustang Boss 429.jpeg" alt="Showroom Grid">
            </div>
            <div class="blog-review-box">
                <p id="car-description">Please choose an era, country, and car manufacturer from the top navigation dashboard matrix to begin loading the profile data.</p>
            </div>
        </section>

        <!-- Right Column: Performance Meters & Specs -->
        <section class="car-stats">
            <h2>VEHICLE PERFORMANCE DATA</h2>
            <div class="stat-group">
                <label>TOP SPEED</label>
                <div class="bar-container"><div id="stat-speed" class="stat-bar"></div></div>
            </div>
            <div class="stat-group">
                <label>ACCELERATION</label>
                <div class="bar-container"><div id="stat-accel" class="stat-bar"></div></div>
            </div>
            <div class="stat-group">
                <label>HANDLING</label>
                <div class="bar-container"><div id="stat-handling" class="stat-bar"></div></div>
            </div>

            <!-- MECHANICAL ENGINE SPECIFICATIONS -->
            <div class="specs-panel">
                <h3>MECHANICAL PROFILE</h3>
                <div class="spec-line"><span class="spec-label">ENGINE:</span> <span id="spec-engine">--</span></div>
                <div class="spec-line"><span class="spec-label">POWER:</span> <span id="spec-power">--</span></div>
                <div class="spec-line"><span class="spec-label">DRIVETRAIN:</span> <span id="spec-layout">--</span></div>
            </div>
        </section>
    </main>

    <!-- 💡 HERE IS WHERE THE JAVASCRIPT LIVES INSIDE THE HTML FILE 💡 -->
    <script>
        // Combine our three separate database blocks into one master array matrix
        const carDatabase = {
            ...carDatabaseEarly,
            ...carDatabaseMiddle,
            ...carDatabaseModern
        };

        window.onload = function() {
            const eraSelect = document.getElementById("era-dropdown");
            eraSelect.innerHTML = '<option value="">-- Select Era --</option>';
            Object.keys(carDatabase).forEach(era => {
                eraSelect.innerHTML += `<option value="${era}">${era}</option>`;
            });
        };

        function updateCountries() {
            const era = document.getElementById("era-dropdown").value;
            const countrySelect = document.getElementById("country-dropdown");
            const brandSelect = document.getElementById("brand-dropdown");
            
            countrySelect.innerHTML = '<option value="">-- Choose Country --</option>';
            brandSelect.innerHTML = '<option value="">-- Choose Brand --</option>';
            
            if (!era) return;
            document.body.className = "era-" + era;

            Object.keys(carDatabase[era]).forEach(country => {
                countrySelect.innerHTML += `<option value="${country}">${country}</option>`;
            });
        }

        function updateBrands() {
            const era = document.getElementById("era-dropdown").value;
            const country = document.getElementById("country-dropdown").value;
            const brandSelect = document.getElementById("brand-dropdown");
            
            brandSelect.innerHTML = '<option value="">-- Choose Brand --</option>';
            if (!era || !country) return;

            Object.keys(carDatabase[era][country]).forEach(brand => {
                brandSelect.innerHTML += `<option value="${brand}">${brand}</option>`;
            });
        }

        function loadSelectedCar() {

            const brand = document.getElementById("brand-dropdown").value;

            document.getElementById('spec-power').innerText = car.power;
            document.getElementById('spec-layout').innerText = car.drivetrain;
